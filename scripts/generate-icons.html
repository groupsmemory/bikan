<!DOCTYPE html>
<html>
<head><title>BIKAN PWA Icon Generator</title></head>
<body style="font-family: system-ui; padding: 40px; background: #f8fafc;">
  <h1>BIKAN PWA Icon Generator</h1>
  <p>Buka file ini di browser, lalu klik tombol untuk download ikon PNG.</p>
  
  <div style="display: flex; gap: 20px; margin: 20px 0;">
    <div>
      <canvas id="canvas192" width="192" height="192" style="border: 1px solid #e2e8f0; border-radius: 8px;"></canvas>
      <br><button onclick="download(192)">Download 192x192</button>
    </div>
    <div>
      <canvas id="canvas512" width="512" height="512" style="border: 1px solid #e2e8f0; border-radius: 8px;"></canvas>
      <br><button onclick="download(512)">Download 512x512</button>
    </div>
  </div>

  <script>
    function drawIcon(ctx, size) {
      const s = size / 512; // scale factor

      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#1E293B');
      grad.addColorStop(1, '#0F172A');
      
      // Rounded rect
      const r = 96 * s;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Letter "B"
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `900 ${280 * s}px system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('B', size / 2, size / 2 - 10 * s);

      // Parabola accent
      const accentGrad = ctx.createLinearGradient(140 * s, 0, 372 * s, 0);
      accentGrad.addColorStop(0, '#F97316');
      accentGrad.addColorStop(1, '#EA580C');
      
      ctx.strokeStyle = accentGrad;
      ctx.lineWidth = 8 * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(140 * s, 420 * s);
      ctx.quadraticCurveTo(256 * s, 350 * s, 372 * s, 420 * s);
      ctx.stroke();

      // Vertex dot
      ctx.fillStyle = '#F97316';
      ctx.beginPath();
      ctx.arc(256 * s, 385 * s, 6 * s, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw both sizes
    drawIcon(document.getElementById('canvas192').getContext('2d'), 192);
    drawIcon(document.getElementById('canvas512').getContext('2d'), 512);

    function download(size) {
      const canvas = document.getElementById('canvas' + size);
      const link = document.createElement('a');
      link.download = 'icon-' + size + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
